<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tauri v2 prevents the default context menu / text selection in the window. -->
  <meta name="tauri-drag-region" />
  <title>AnonChat</title>

  <style>
    /* ── Reset & base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #000000;
      --surface:      #08080f;
      --border:       #12122a;
      --text-muted:   #444466;
      --text-dim:     #7070a0;
      --text-normal:  #c0c0e0;
      --accent-cyan:  #00d4ff;
      --accent-green: #00ffa0;
      --font-mono:    'JetBrains Mono', 'Fira Mono', 'Cascadia Code',
                      'Consolas', 'Courier New', monospace;
    }

    html, body {
      height: 100%;
      width:  100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text-normal);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App shell: top split + terminal bottom ────────────────────────── */
    #app {
      display:        flex;
      flex-direction: column;
      height:         100vh;
      width:          100vw;
    }

    #top-shell {
      flex:       1 1 0;
      min-height: 0;
      display:    grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }

    /* ── Globe area ────────────────────────────────────────────────────── */
    #globe-wrap {
      position:   relative;
      flex:       1 1 auto;
      min-height: 0;          /* allow flex shrink past content size */
      overflow:   hidden;
      background: var(--bg);
      border-right: 1px solid var(--border);
    }

    #globe-canvas {
      display: block;
      width:   100%;
      height:  100%;
    }

    /* Chain status pill – top-centre overlay */
    #chain-status {
      position:    absolute;
      top:         14px;
      left:        50%;
      transform:   translateX(-50%);
      padding:     4px 16px;
      border:      1px solid var(--border);
      border-radius: 999px;
      background:  rgba(0, 0, 0, 0.7);
      color:       var(--accent-cyan);
      font-size:   11px;
      letter-spacing: 0.12em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    /* Corner branding */
    #brand {
      position:   absolute;
      bottom:     10px;
      left:       16px;
      font-size:  10px;
      color:      var(--text-muted);
      letter-spacing: 0.18em;
      user-select: none;
      pointer-events: none;
    }

    /* ── Chat panel (right half) ──────────────────────────────────────── */
    #chat-wrap {
      min-height: 0;
      background: linear-gradient(180deg, #04040a 0%, #070710 100%);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      position: relative;
    }

    #chat-topbar {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.12em;
      user-select: none;
    }

    #chat-title {
      color: var(--accent-green);
    }

    #chat-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #service-settings {
      border: 1px solid var(--border);
      background: #0c0c17;
      color: var(--text-normal);
      border-radius: 6px;
      padding: 5px 8px;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    #service-settings:focus-visible,
    #service-settings-form :focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    #service-settings-dialog {
      width: min(460px, calc(100vw - 32px));
      margin: auto;
      padding: 22px;
      border: 1px solid #28515a;
      border-radius: 8px;
      background: #080d12;
      color: var(--text-normal);
      font: inherit;
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.75);
    }

    #service-settings-dialog::backdrop { background: rgba(0, 0, 0, 0.78); }
    #service-settings-dialog h2 { color: var(--accent-cyan); font-size: 14px; margin-bottom: 18px; }
    #service-settings-form { display: grid; gap: 9px; }
    #service-settings-form label { color: var(--text-dim); font-size: 11px; }
    #service-settings-form input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #05070a;
      color: var(--text-normal);
      font: inherit;
      font-size: 12px;
    }
    #service-settings-error { min-height: 1.4em; color: #ff7777; font-size: 11px; }
    #service-settings-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    #service-settings-actions button {
      min-width: 84px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #0c0c17;
      color: var(--text-normal);
      font: inherit;
      cursor: pointer;
    }
    #service-settings-actions button[type="submit"] { color: var(--accent-green); }

    #chat-conn-status {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    #chat-conn-status[data-state="connected"]    { color: var(--accent-green); }
    #chat-conn-status[data-state="degraded"],
    #chat-conn-status[data-state="reconnecting"] { color: #ffb700; }
    #chat-conn-status[data-state="failed"]       { color: #ff4444; }

    #chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }

    #chat-form input,
    #chat-form textarea {
      width: 100%;
      background: #0b0b16;
      color: var(--text-normal);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      font-size: 12px;
      resize: none;
    }

    #chat-form button {
      border: 1px solid var(--border);
      background: #0c0c17;
      color: var(--accent-green);
      border-radius: 8px;
      padding: 0 14px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
    }
    #chat-form button:hover:not(:disabled) { background: #141427; }
    #chat-form button:disabled { opacity: 0.4; cursor: not-allowed; }
    #chat-recipient-label,
    #chat-recipient { grid-column: 1 / -1; }
    #chat-recipient-label { color: var(--text-dim); font-size: 10px; }
    #chat-retry { grid-column: 1 / -1; color: #ffb700; }
    #chat-retry[hidden] { display: none; }

    #chat-form :focus-visible,
    #sound-toggle:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #sound-toggle {
      border: 1px solid var(--border);
      background: #0c0c17;
      color: #f0f6ff;
      border-radius: 8px;
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 14px;
    }

    #sound-toggle:hover {
      background: #141427;
    }

    #chat-users {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
    }

    .chat-user-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--text-normal);
      font-size: 11px;
      white-space: nowrap;
      background: #0b0b16;
    }

    .chat-user-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #37ff87;
      box-shadow: 0 0 8px #37ff87;
      flex-shrink: 0;
    }

    #chat-messages {
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .chat-message {
      border: 1px solid #1a1a34;
      background: rgba(12, 12, 24, 0.75);
      border-radius: 10px;
      padding: 8px 10px;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .chat-message.expiring {
      opacity: 0;
      transform: scale(0.98);
    }

    .chat-message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .chat-from {
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
    }

    .chat-timer {
      color: #ffc868;
      font-variant-numeric: tabular-nums;
    }

    .chat-text {
      font-size: 12px;
      color: #dbe2ff;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* ── Terminal section ──────────────────────────────────────────────── */
    #terminal-section {
      flex:         0 0 220px;
      display:      flex;
      flex-direction: column;
      border-top:   1px solid var(--border);
      background:   var(--surface);
      min-height:   0;
    }

    /* Header bar */
    #terminal-header {
      display:         flex;
      align-items:     center;
      gap:             8px;
      padding:         4px 12px;
      border-bottom:   1px solid var(--border);
      background:      #0a0a14;
      font-size:       10px;
      letter-spacing:  0.14em;
      color:           var(--text-dim);
      user-select:     none;
    }

    #terminal-header .dot {
      width:         7px;
      height:        7px;
      border-radius: 50%;
    }
    #terminal-header .dot-red   { background: #ff453a; }
    #terminal-header .dot-amber { background: #ffb700; }
    #terminal-header .dot-green { background: #32d74b; }

    /* Scrollable log body */
    #terminal {
      flex:        1 1 0;
      overflow-y:  auto;
      overflow-x:  hidden;
      padding:     6px 12px 8px;
      font-size:   11.5px;
      line-height: 1.65;
      color:       var(--text-normal);
    }

    /* Thin scrollbar */
    #terminal::-webkit-scrollbar             { width: 4px; }
    #terminal::-webkit-scrollbar-track       { background: transparent; }
    #terminal::-webkit-scrollbar-thumb       { background: var(--border); border-radius: 2px; }
    #terminal::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Log line anatomy ──────────────────────────────────────────────── */
    .log-line {
      display:   flex;
      gap:       10px;
      white-space: pre;
      min-height: 1.65em;
    }

    .log-ts {
      color:      var(--text-muted);
      min-width:  12ch;
      user-select: none;
      flex-shrink: 0;
    }

    .log-badge {
      min-width:   5ch;
      font-weight: 600;
      flex-shrink: 0;
    }

    .log-msg {
      color:     var(--text-normal);
      word-break: break-all;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="top-shell">
      <!-- ── Globe (left half) ─────────────────────────────────────── -->
      <div id="globe-wrap">
        <canvas id="globe-canvas"></canvas>

        <div id="chain-status">CONNECTING…</div>
        <div id="brand">ANONCHAT · ZERO KNOWLEDGE</div>
      </div>

      <!-- ── Chat (right half) ─────────────────────────────────────── -->
      <aside id="chat-wrap" aria-label="Ephemeral chat panel">
        <div id="chat-topbar">
          <span id="chat-title">EPHEMERAL CHAT</span>
          <div id="chat-controls">
            <span id="chat-conn-status" role="status" aria-live="polite">CONNECTING</span>
            <button id="service-settings" type="button" aria-label="Configure service endpoints">ENDPOINTS</button>
            <button id="sound-toggle" type="button" aria-label="Mute system sounds">🔊</button>
          </div>
        </div>

        <div id="chat-users" aria-label="Online users"></div>
        <div id="chat-messages" aria-live="polite" aria-atomic="false"></div>

        <form id="chat-form" autocomplete="off">
          <label id="chat-recipient-label" for="chat-recipient">Recipient user ID (optional; blank sends to room)</label>
          <input id="chat-recipient" type="text" placeholder="Recipient user ID" aria-describedby="chat-recipient-label" />
          <label class="sr-only" for="chat-body">Message</label>
          <textarea id="chat-body" rows="2" placeholder="message (Enter to send)" maxlength="2000" required></textarea>
          <button id="chat-send" type="submit" disabled>SEND</button>
          <button id="chat-retry" type="button" hidden>RETRY CONNECTION</button>
        </form>
      </aside>
    </div>

    <!-- ── Terminal ─────────────────────────────────────────────────── -->
    <section id="terminal-section" aria-label="Core log output">
      <div id="terminal-header">
        <span class="dot dot-red"></span>
        <span class="dot dot-amber"></span>
        <span class="dot dot-green"></span>
        <span>● ANON CORE LOG</span>
      </div>
      <div id="terminal" role="log" aria-live="polite" aria-atomic="false"></div>
    </section>

    <dialog id="service-settings-dialog" aria-labelledby="service-settings-title">
      <h2 id="service-settings-title">REMOTE SERVICE ENDPOINTS</h2>
      <form id="service-settings-form">
        <label for="router-endpoint">Chat router WebSocket URL</label>
        <input id="router-endpoint" type="url" inputmode="url" placeholder="wss://chat.example.com/ws" autocomplete="url" required />
        <label for="registry-endpoint">Proxy registry HTTPS URL</label>
        <input id="registry-endpoint" type="url" inputmode="url" placeholder="https://chat.example.com/api/proxies/active" autocomplete="url" required />
        <p id="service-settings-error" role="alert" aria-live="polite"></p>
        <div id="service-settings-actions">
          <button id="service-settings-cancel" type="button">CANCEL</button>
          <button type="submit">SAVE</button>
        </div>
      </form>
    </dialog>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
