[package]
name = "security-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "pkcs8"] }
rand = "0.8.5"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.63"
zeroize = { version = "1.8.1", features = ["derive"] }

# Onion cipher dependencies
x25519-dalek  = { version = "2.0.1", features = ["static_secrets"] }
aes-gcm       = "0.10.3"
hkdf          = "0.12.4"
sha2          = "0.10.8"
base64        = "0.22.1"
reqwest       = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls"] }
tokio         = { version = "1.40.0", features = ["rt"] }

# Alias to keep API naming aligned with product docs.
libsignal-client = { package = "libsignal-protocol", git = "https://github.com/signalapp/libsignal", branch = "main" }

[dev-dependencies]
tempfile = "3.12.0"
